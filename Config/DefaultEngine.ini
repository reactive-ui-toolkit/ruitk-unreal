; Demo maps land in Phase 2 (MASTER_PLAN §3); the gallery map becomes the default then.

[/Script/Engine.Engine]
; The CommonUI plugin is enabled (RuitkCommonUI interop). CommonUI routes input through its own
; game viewport client — without this, Play logs "Using CommonUI without a CommonGameViewportClient
; derived game viewport client" and CommonUI input routing is dead. This is the real fix (not the
; CommonUI.Debug.CheckGameViewportClientValid=0 suppression).
GameViewportClientClassName=/Script/CommonUI.CommonGameViewportClient

[/Script/Engine.RendererSettings]
; Keep the demo project lightweight — no ray tracing / heavyweight defaults needed for UI work.
r.ReflectionMethod=0
r.DynamicGlobalIlluminationMethod=0

[/Script/EngineSettings.GameMapsSettings]
; Press Play on any level: the demo game mode mounts the Reactive UI Toolkit gallery over the viewport.
GlobalDefaultGameMode=/Script/RuitkDemo.RuitkDemoGameMode
; Featherweight startup map (engine Entry map): the 5.6 Open World template TDRs weak GPUs
; and the UI demo needs zero scene.
EditorStartupMap=/Engine/Maps/Entry
GameDefaultMap=/Engine/Maps/Entry

[SystemSettings]
; GPU relief for the UI demo on modest cards: no virtual shadow maps, cheap AA instead of TSR.
r.Shadow.Virtual.Enable=0
r.AntiAliasingMethod=1

[CoreRedirects]
; 0.15.0 rebrand (Reactive UI Toolkit): UHT-reflected type + module renames. This repo tracks no
; .uasset/.umap, so nothing here fires locally — the block exists so this project stays a working
; reference for the migration. No reflected legacy USTRUCTs/UENUMs existed, so ClassRedirects are
; the complete inventory.
;
; TWO GROUPS, and the split is deliberate. The SHIPPED-PLUGIN group below is what a user's content
; can actually reference, and is the only part reproduced in MIGRATION-0.15.md. The HOST-PROJECT
; group after it covers this repo's own non-shipped demo/test modules; a user never had those
; modules, so redirecting them in a user's ini would be dead config. Kept complete here (rather
; than the previous partial list) so the repo's own module renames are covered without exception.

; --- shipped plugin (the user-facing set) ---
+ClassRedirects=(OldName="/Script/ReactiveUIUMG.RuiHostWidget",NewName="/Script/RuitkUMG.RuitkHostWidget")
+ClassRedirects=(OldName="/Script/ReactiveUIUMG.RuiSignalViewModel",NewName="/Script/RuitkUMG.RuitkSignalViewModel")
+ClassRedirects=(OldName="/Script/ReactiveUIUMG.RuiWorldSubsystem",NewName="/Script/RuitkUMG.RuitkWorldSubsystem")
+ClassRedirects=(OldName="/Script/ReactiveUICommonUI.RuiActivatableScreen",NewName="/Script/RuitkCommonUI.RuitkActivatableScreen")
+ClassRedirects=(OldName="/Script/ReactiveUIMVVMBridge.RuiMvvmViewModel",NewName="/Script/RuitkMVVMBridge.RuitkMvvmViewModel")

; --- host project only (RuiHostTests / RuiDemo — not shipped, never in a user project) ---
+ClassRedirects=(OldName="/Script/RuiHostTests.RuiTestViewModel",NewName="/Script/RuitkHostTests.RuitkTestViewModel")
+ClassRedirects=(OldName="/Script/RuiHostTests.RuiTestUserWidget",NewName="/Script/RuitkHostTests.RuitkTestUserWidget")
+ClassRedirects=(OldName="/Script/RuiHostTests.RuiTestMvvmSubViewModel",NewName="/Script/RuitkHostTests.RuitkTestMvvmSubViewModel")
+ClassRedirects=(OldName="/Script/RuiDemo.RuiDemoGameMode",NewName="/Script/RuitkDemo.RuitkDemoGameMode")
; the demo interop widgets: class names never carried the brand, but the MODULE rename moved
