# Tests — the family CI contract: every push/PR to master/dev reports EXACTLY four check
# contexts — `gates`, `tests`, `extensions`, `docs` (the job `name:`s below). Those four names
# are the required status checks in the canonical branch-ruleset pair (.github/rulesets/);
# rename a job here and dev becomes un-mergeable until the rulesets are re-imported.
#
# REQUIRED-CHECKS TRAP (deliberate, keep it): NO `paths:` filters on gates/tests/extensions/docs.
# These four jobs ARE the required status checks; a paths-filtered required check never reports on
# unrelated PRs and makes them permanently un-mergeable (the sibling repo documented this
# failure mode in-file — house style is to write the reason down, so: this comment).
# Staged jobs (tests, docs) instead SELF-GUARD inside the job: if their directory
# doesn't exist yet, they log "not armed yet" and exit 0 — required checks always report on
# every commit of every branch lineage.
#
# NO engine job here (deliberate — do not "helpfully" re-add the 5.6/5.7/5.8 matrix): engine
# verification runs at publish time ONLY (owner decision, 2026-07-31). publish.yml's armed
# verify-engines legs call .github/workflows/engine-tests.yml, which stays for exactly that.
name: Tests

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything engine-free that guards the tree: the node script gates + the clang-format
  # style check, folded in as steps so they report as ONE required check context.
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: changelog verify (Lane B drift gate)
        run: node ide-extensions/scripts/changelog.mjs verify
      - name: changelog mirror byte-identity (Lane A)
        run: node scripts/verify-mirror.mjs
      - name: copyright headers (Fab requirement, D-01)
        run: node scripts/check-headers.mjs
      - name: skills lint (frontmatter + scar tissue)
        run: node scripts/lint-skills.mjs
      - name: docs-drift tripwire (claimed counts vs registries)
        run: node scripts/docs-drift.mjs
      - name: style/slot builder coverage (TD-013 — schema keys must have Ruitk::Style()/Slot() methods)
        run: node scripts/check-style-builders.mjs
      - name: family-corpus hash gate (A4/TD-009 mirror tripwire)
        run: node scripts/corpus-hash.mjs --check
      - name: machine-local paths (no one-machine path in a tracked file)
        run: node scripts/check-machine-paths.mjs
      - name: Install clang-format
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-format
      - name: clang-format check (Source trees against .clang-format)
        run: |
          set -e
          # GENERATED code is excluded: *.uetkx.inl + *.Uetkx.gen.cpp are RuitkCompile output
          # (DO NOT EDIT banners; the codegen emits its own deterministic shape, pinned by the
          # contract goldens — a human-style gate on machine output would fight the compiler).
          FILES=$(find Source Plugins/ReactiveUIToolkit/Source templates -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.inl' \) -not -name '*.uetkx.inl' -not -name '*.Uetkx.gen.cpp' 2>/dev/null || true)
          if [ -z "$FILES" ]; then echo "no C++ files yet"; exit 0; fi
          clang-format --dry-run -Werror $FILES

  # The repo's engine-free test suite: the shared language server's unit tests + e2e smoke
  # (the engine-side automation suites run at publish time with the engines — see header).
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Guard
        id: guard
        run: |
          if [ ! -f ide-extensions/lsp-server/package.json ]; then
            echo "lsp-server not armed yet — reporting success so required checks always report."
            echo "armed=false" >> "$GITHUB_OUTPUT"
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.armed == 'true'
        with:
          node-version: 22
      - name: Build + unit tests + e2e smoke
        if: steps.guard.outputs.armed == 'true'
        working-directory: ide-extensions/lsp-server
        run: |
          npm ci
          npm run build
          node --test out/test/*.test.js
          node scripts/smoke.js

  # The VS Code extension (vscode-uetkx) compiles: npm ci + tsc + the server bundle. The
  # language server is built first because the extension's build step bundles it
  # (scripts/bundle-server.mjs copies ../lsp-server/out into ./server). The VS2022 extension
  # stays OUT of push/PR CI as before — it needs MSBuild + the VS SDK and is built by
  # publish.yml's publish-vs2022 leg on a Windows runner.
  extensions:
    name: extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build language server (bundle input for the extension)
        working-directory: ide-extensions/lsp-server
        run: |
          npm ci
          npm run build
      - name: Build VS Code extension (compile + bundle server)
        working-directory: ide-extensions/vscode-uetkx
        run: |
          npm ci
          npm run build

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Guard
        id: guard
        run: |
          if [ ! -f "RuitkUnrealDocs~/package.json" ]; then
            echo "docs not armed yet — reporting success so required checks always report."
            echo "armed=false" >> "$GITHUB_OUTPUT"
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.armed == 'true'
        with:
          node-version: 22
      - name: Build + lint
        if: steps.guard.outputs.armed == 'true'
        working-directory: RuitkUnrealDocs~
        run: |
          npm ci
          npm run build
          npm run lint
